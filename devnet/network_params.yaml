# EuroRollup Settlement Lab — pinned local OP Stack devnet.
#
# L1: minimal-preset Ethereum devnet (geth execution + lighthouse consensus).
# L2: op-reth execution + op-node consensus, op-batcher for blob DA and the
# package-default op-proposer/op-challenger for fault proofs.
#
# Every image reference used for release evidence is recorded with its resolved
# digest in `evidence/a05/protocol-run.json`; the config below pins the official
# release tags of the OP components and leaves the L1 package images at the
# package defaults that were resolved at run time.
optimism_package:
  # The upstream package registers op-service metrics jobs unconditionally, so the
  # observability stack stays enabled; its containers are stopped with the enclave.
  chains:
    eurorollup:
      participants:
        node0:
          sequencer: true
          el:
            type: op-reth
            image: ghcr.io/paradigmxyz/op-reth:v1.6.0
          cl:
            type: op-node
            image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.13.4
      network_params:
        network: eurorollup
        network_id: "31338"
        seconds_per_slot: 2
        fjord_time_offset: 0
        granite_time_offset: 0
        fund_dev_accounts: true
      batcher_params:
        image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:v1.14.0
      blockscout_params:
        enabled: false
      tx_fuzzer_params:
        enabled: false
  op_contract_deployer_params:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-deployer:v0.4.2
    l1_artifacts_locator: tag://op-contracts/v4.0.0
    l2_artifacts_locator: tag://op-contracts/v4.0.0
  global_log_level: info
  persistent: false
ethereum_package:
  # When network_params is omitted the upstream package injects its own default
  # participant list and silently replaces this one. Providing the same L1
  # defaults explicitly keeps the supernode participant below.
  network_params:
    preset: minimal
    genesis_delay: 5
    additional_preloaded_contracts: >
      {"0x4e59b44847b379578588920cA78FbF26c0B4956C": {"balance": "0ETH", "code": "0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3", "storage": {}, "nonce": "1"}}
  participants:
    - el_type: geth
      # Prysm is pinned by the ethereum-package defaults and is used here because
      # the current lighthouse image rejects locally produced blocks on a
      # single-node devnet with the pinned genesis.
      cl_type: prysm
