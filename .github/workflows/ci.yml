name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and fixture tests
        run: pnpm test

      - name: Build web replay
        run: pnpm build

      - name: Replay G01 evidence and check committed bytes
        run: pnpm scenario:golden -- --check

      - name: Check A02 boundary dealing cases
        run: pnpm scenario:boundary -- --check

      - name: Run A02 and A06 API evidence cases
        run: pnpm scenario:api -- --check

      - name: Replay the P01 Policy Lab comparison
        run: pnpm policy:replay -- --check

      - name: Verify the Policy Lab comparison pack
        run: pnpm policy:verify

      - name: Run the evaluation harness against a scripted model
        run: pnpm policy:eval -- --adapter mock

      - name: Verify the committed live-model evaluation
        run: pnpm policy:eval -- --verify-only

      - name: Rebuild the eligibility policy matrix
        run: pnpm eligibility:matrix -- --check

      - name: Verify the committed eligibility evidence and proofs
        run: pnpm eligibility:verify

      - name: Verify the committed account-abstraction receipts
        run: pnpm aa:verify

      - name: Verify the committed A05 protocol-run and bridge-trace evidence
        run: pnpm a05:verify

      - name: Verify the committed A07 economics evidence
        run: pnpm a07:verify

      - name: Verify the committed A08 public-release evidence
        run: pnpm a08:verify

      - name: Verify the committed release-check matrix
        run: pnpm release:verify

      - name: Verify the REL-01 release attestations
        run: |
          pnpm release:attest:verify
          RELEASE_ATTESTATION_IN=evidence/release-attestation-v1.1.0.json pnpm release:attest:verify

      - name: Check the generated OpenAPI document
        run: pnpm api:openapi -- --check

      - name: Verify the committed evidence pack
        run: pnpm verify

      - name: Run the partner SDK quickstart against the local API
        run: pnpm demo:partner

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-g01
          path: |
            evidence/g01
            evidence/a02
            evidence/a06
            evidence/policy-lab
          retention-days: 30
          if-no-files-found: error
